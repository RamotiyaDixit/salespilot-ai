name: Capture app screenshots
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - name: Build mobile app for web capture
        working-directory: apps/mobile
        env:
          EXPO_PUBLIC_API_URL: http://127.0.0.1:4000
        run: npx expo export --platform web --output-dir dist
      - name: Build web dashboard
        env:
          NEXT_PUBLIC_API_URL: http://127.0.0.1:4000
        run: npm run build:web
      - name: Start demo API
        run: nohup npm run dev:api > /tmp/salespilot-api.log 2>&1 &
      - name: Start web dashboard
        run: nohup npm run start --workspace @salespilot/web -- --hostname 127.0.0.1 > /tmp/salespilot-web.log 2>&1 &
      - name: Start Expo web build
        run: nohup node .github/scripts/serve-static.mjs apps/mobile/dist 8081 > /tmp/salespilot-mobile.log 2>&1 &
      - name: Capture actual app screenshots
        run: node .github/scripts/capture-screenshots.mjs
      - name: Commit screenshots to README assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots/web-dashboard.png docs/screenshots/mobile-app.png
          if git diff --cached --quiet; then
            echo "Screenshots unchanged."
          else
            git commit -m "docs: refresh app screenshots [skip ci]"
            git push
          fi
